<!DOCTYPE html>
<!--
  Doom shareware in-browser via doom.wasm (jacobenget/doom.wasm).
  Keyboard listeners are on window so focus works reliably inside an iframe.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doom shareware</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      canvas#DoomGame {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        image-rendering: pixelated;
        outline: none;
        cursor: crosshair;
        opacity: 0.85;
      }
      canvas#DoomGame:focus {
        opacity: 1;
      }
      #hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 12px;
        background: rgba(0,0,0,0.72);
        color: #cbd5e1;
        font-size: 12px;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #hint.hidden { opacity: 0; }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #7dd3fc;
        font-size: 12px;
        background: rgba(0,0,0,0.55);
        padding: 4px 8px;
        border-radius: 6px;
      }
    </style>
    <script type="text/javascript">
      function loadDoomGame(canvas) {
        let moduleInstanceMemory = null;
        let exports = null;
        let ctx = canvas.getContext("2d");
        let scratchSpaceImageData = null;
        const pressed = new Set();

        function onGameInit(width, height) {
          canvas.width = width;
          canvas.height = height;
          scratchSpaceImageData = ctx.createImageData(width, height);
          const status = document.getElementById("status");
          if (status) status.textContent = "Ready — click game, then use keys";
          focusCanvas();
        }

        function drawFrame(indexOfFrameBuffer) {
          const doomFrameBuffer = new Uint8Array(
            moduleInstanceMemory.buffer,
            indexOfFrameBuffer,
            canvas.width * canvas.height * 4
          );
          for (var i = 0; i < scratchSpaceImageData.data.length / 4; i++) {
            scratchSpaceImageData.data[4 * i + 0] = doomFrameBuffer[4 * i + 2];
            scratchSpaceImageData.data[4 * i + 1] = doomFrameBuffer[4 * i + 1];
            scratchSpaceImageData.data[4 * i + 2] = doomFrameBuffer[4 * i + 0];
            scratchSpaceImageData.data[4 * i + 3] = 255;
          }
          ctx.putImageData(scratchSpaceImageData, 0, 0);
        }

        function timeInMilliseconds() {
          return BigInt(Math.trunc(performance.now()));
        }

        function readModuleMemoryAsUtf8String(moduleMemory, offsetIntoMemory, stringByteLength) {
          const buffer8 = new Uint8Array(moduleMemory.buffer);
          const dec = new TextDecoder("utf-8", { fatal: false });
          return dec.decode(buffer8.slice(offsetIntoMemory, offsetIntoMemory + stringByteLength));
        }

        function onInfoMessage(messagePtr, length) {
          console.log("[Doom]", readModuleMemoryAsUtf8String(moduleInstanceMemory, messagePtr, length));
        }

        function onErrorMessage(messagePtr, length) {
          console.error("[Doom]", readModuleMemoryAsUtf8String(moduleInstanceMemory, messagePtr, length));
        }

        const imports = {
          loading: {
            onGameInit: onGameInit,
            wadSizes: () => {},
            readWads: () => {},
          },
          ui: { drawFrame: drawFrame },
          runtimeControl: { timeInMilliseconds: timeInMilliseconds },
          console: {
            onInfoMessage: onInfoMessage,
            onErrorMessage: onErrorMessage,
          },
          gameSaving: {
            sizeOfSaveGame: () => 0,
            readSaveGame: () => 0,
            writeSaveGame: () => 0,
          },
        };

        function focusCanvas() {
          try {
            canvas.focus({ preventScroll: true });
          } catch (_) {
            canvas.focus();
          }
          const hint = document.getElementById("hint");
          if (hint) hint.classList.add("hidden");
        }

        function buildKeyMap(ex) {
          return new Map([
            ["ArrowLeft", ex.KEY_LEFTARROW],
            ["ArrowRight", ex.KEY_RIGHTARROW],
            ["ArrowUp", ex.KEY_UPARROW],
            ["ArrowDown", ex.KEY_DOWNARROW],
            ["a", ex.KEY_STRAFE_L],
            ["A", ex.KEY_STRAFE_L],
            ["d", ex.KEY_STRAFE_R],
            ["D", ex.KEY_STRAFE_R],
            ["w", ex.KEY_UPARROW],
            ["W", ex.KEY_UPARROW],
            ["s", ex.KEY_DOWNARROW],
            ["S", ex.KEY_DOWNARROW],
            [",", ex.KEY_STRAFE_L],
            [".", ex.KEY_STRAFE_R],
            ["Control", ex.KEY_FIRE],
            [" ", ex.KEY_USE],
            ["Shift", ex.KEY_SHIFT],
            ["Tab", ex.KEY_TAB],
            ["Escape", ex.KEY_ESCAPE],
            ["Enter", ex.KEY_ENTER],
            ["Backspace", ex.KEY_BACKSPACE],
            ["Alt", ex.KEY_ALT],
          ]);
        }

        function convertKeyEventToDoomKey(event, keyMap) {
          let correspondingDoomKey = null;
          if (keyMap.has(event.key)) {
            correspondingDoomKey = keyMap.get(event.key);
          } else if (event.key.length === 1) {
            correspondingDoomKey = event.key.toLowerCase().charCodeAt(0);
          }
          if (correspondingDoomKey !== null) {
            event.stopPropagation();
            event.preventDefault();
          }
          return correspondingDoomKey;
        }

        WebAssembly.instantiateStreaming(fetch("assets/doom.wasm"), imports).then(({ instance }) => {
          exports = instance.exports;
          moduleInstanceMemory = exports.memory;
          const keyMap = buildKeyMap(exports);

          // Window-level listeners so keys work as long as the iframe document is focused
          window.addEventListener("keydown", function (event) {
            if (event.repeat) return;
            const doomKey = convertKeyEventToDoomKey(event, keyMap);
            if (doomKey !== null && !pressed.has(doomKey)) {
              pressed.add(doomKey);
              exports.reportKeyDown(doomKey);
            }
          });
          window.addEventListener("keyup", function (event) {
            const doomKey = convertKeyEventToDoomKey(event, keyMap);
            if (doomKey !== null) {
              pressed.delete(doomKey);
              exports.reportKeyUp(doomKey);
            }
          });

          // Release all keys if focus leaves the iframe
          window.addEventListener("blur", function () {
            for (const k of pressed) exports.reportKeyUp(k);
            pressed.clear();
            const hint = document.getElementById("hint");
            if (hint) hint.classList.remove("hidden");
          });

          canvas.addEventListener("pointerdown", focusCanvas);
          document.addEventListener("pointerdown", focusCanvas);
          window.addEventListener("focus", focusCanvas);

          // Parent page can request focus or forward keyboard events
          window.addEventListener("message", function (ev) {
            if (!ev.data) return;
            if (ev.data.type === "doom-focus") {
              focusCanvas();
              return;
            }
            if (ev.data.type === "doom-key" && exports) {
              const fake = {
                key: ev.data.key,
                code: ev.data.code,
                repeat: !!ev.data.repeat,
                stopPropagation: function () {},
                preventDefault: function () {},
              };
              const doomKey = convertKeyEventToDoomKey(fake, keyMap);
              if (doomKey === null) return;
              if (ev.data.eventType === "keydown") {
                if (!fake.repeat && !pressed.has(doomKey)) {
                  pressed.add(doomKey);
                  exports.reportKeyDown(doomKey);
                }
              } else if (ev.data.eventType === "keyup") {
                if (pressed.has(doomKey)) {
                  pressed.delete(doomKey);
                  exports.reportKeyUp(doomKey);
                }
              }
            }
          });

          exports.initGame();
          setInterval(exports.tickGame, 1000 / 35);
          focusCanvas();
        }).catch(function (err) {
          const status = document.getElementById("status");
          if (status) status.textContent = "Failed to load doom.wasm";
          console.error(err);
        });
      }

      addEventListener("load", function () {
        const canvas = document.getElementById("DoomGame");
        loadDoomGame(canvas);
      });
    </script>
  </head>
  <body>
    <div id="wrap">
      <div id="status">Loading Doom…</div>
      <canvas id="DoomGame" tabindex="0"></canvas>
      <div id="hint">Click here for keyboard · WASD / arrows move · Ctrl fire · Space use · Enter select</div>
    </div>
  </body>
</html>
